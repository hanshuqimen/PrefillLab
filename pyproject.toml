[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prefilllab"
version = "0.1.0"
description = "Understand where your LLM prefill time goes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "PrefillLab contributors"}]
dependencies = ["typer>=0.15,<1", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<3", "numpy>=1.26,<3", "pandas>=2.2,<4", "psutil>=6,<8"]

[project.optional-dependencies]
transformers = ["torch>=2.5,<3", "transformers>=4.48,<5", "nvidia-ml-py>=12"]
dev = ["pytest>=8,<10", "pytest-cov>=6", "httpx>=0.27,<1", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "types-psutil", "pandas-stubs"]

[project.scripts]
prefilllab = "prefilllab.cli.app:main"

[project.urls]
Homepage = "https://github.com/hanshuqimen/PrefillLab"
Issues = "https://github.com/hanshuqimen/PrefillLab/issues"

[tool.hatch.build.targets.wheel]
packages = ["prefilllab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not gpu and not integration'"
markers = ["gpu: requires CUDA", "integration: requires optional torch/transformers dependencies"]
